name: render
on:
  push:
    paths: ['content.py', 'tpl.py', 'svgs.py', 'fonts.css', 'render.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow numpy scipy && playwright install --with-deps chromium
      - run: python3 render.py
      - name: commit
        run: |
          git config user.name  "flyway-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs schedule.json
          git diff --staged --quiet || git commit -m "render: rebuild assets"
          git push
