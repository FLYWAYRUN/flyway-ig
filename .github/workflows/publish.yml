name: publish
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'print only, do not post'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: publish due posts
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ASSET_BASE_URL:  ${{ vars.ASSET_BASE_URL }}
          DRY_RUN:         ${{ inputs.dry_run && '1' || '0' }}
        run: python3 publish.py
      - name: commit status
        run: |
          git config user.name  "flyway-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "publish: mark posted"
          git push
